# Builds the mockup and publishes it to GitHub Pages on every push to main.
#
# The build is one self-contained dist/index.html with the script, the stylesheet
# and the fonts inlined, so nothing here depends on the site's base path.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ⛔ npm ci IS BACK, AND THE LOCKFILE IS WHY IT CAN BE.
      # It refused on the runner twice, because the lockfile had been generated on
      # Windows and did not describe Linux: no @emnapi/* — the WASM fallbacks
      # behind Tailwind's native binaries — and no linux-x64 entries. Neither
      # could show locally, because node_modules was already there.
      #
      # Regenerating it FROM SCRATCH (deleting it, then npm install
      # --package-lock-only) records the optional packages for every platform.
      # Measured: 250 packages before and after, ZERO version changes, zero added,
      # zero removed — only the platform entries that were missing.
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
