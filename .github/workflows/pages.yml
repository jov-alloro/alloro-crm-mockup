# Builds the mockup and publishes it to GitHub Pages on every push to main.
#
# The build is one self-contained dist/index.html with the script, the stylesheet
# and the fonts inlined, so nothing here depends on the site's base path.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ⛔ npm install, AND THE ATTEMPT TO EARN npm ci FAILED. Recorded rather
      # than quietly reverted.
      #
      # The lockfile was regenerated FROM SCRATCH on Windows (deleted, then
      # npm install --package-lock-only). That is strictly better and it is kept:
      # 250 packages before and after, ZERO version changes, zero added, zero
      # removed, and it gained linux-x64 entries it did not have.
      #
      # ⛔ IT STILL IS NOT ENOUGH, AND THE REASON IS THE SAME ONE ALL ALONG. npm
      # resolves optional dependencies for the platform it is RUN on, so a
      # Windows machine never walks the branch that pulls @emnapi/* — the WASM
      # fallbacks behind Tailwind's native binaries on Linux. `npm ci` on the
      # runner still reports them missing. A lockfile cannot describe a platform
      # the machine writing it has never installed for.
      #
      # THE REAL FIX, when somebody wants it: generate the lockfile ON LINUX — in
      # this workflow, or in a container — and commit that. Not a Windows job.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
