# Builds the mockup and publishes it to GitHub Pages on every push to main.
#
# The build is one self-contained dist/index.html with the script, the stylesheet
# and the fonts inlined, so nothing here depends on the site's base path.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ⛔ npm install, NOT npm ci, AND THE REASON IS WORTH KNOWING.
      # `npm ci` refuses unless package.json and package-lock.json agree exactly.
      # This lockfile was generated on Windows, so it omits the optional
      # platform packages a Linux runner needs (@emnapi/*, the WASM fallbacks
      # behind Tailwind's native binaries). Nothing is wrong with the code; the
      # lockfile simply does not describe this platform.
      #
      # ⚠ THE COST, STATED: `npm ci` is the reproducible one. `npm install` may
      # resolve a different patch version than the lockfile pins. Regenerating
      # the lockfile on Linux would fix it properly and is worth doing
      # deliberately rather than inside a hotfix.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
