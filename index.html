<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- An internal mockup on a public URL should not be listed by search
         engines. robots.txt asks and a header tells, but GitHub Pages serves
         this from a subpath where robots.txt at the domain root does not
         apply and no header can be set. This meta tag works on both hosts. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Which build the hosted copy is serving. Bumped on purpose to prove a
         push redeploys; it is the one thing on the page a person cannot see
         but curl can read. -->
    <meta name="build" content="2026-09-24-b" />
    <title>Customers — Alloro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
